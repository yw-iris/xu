  <div class="bodytext">
    <p class="lead">他們把我的臉刻進石頭，從此我只能沉默地，接受所有人的祈求。</p>
    <p>可石頭也會<span class="em">流血</span>——如果你肯相信。每一道裂痕，都是一次沒被聽見的回應。</p>
    <p>請像雕刻藝術那樣褻瀆我——不要溫柔，不要恭敬。用你湧動著滾燙血液的手，掐住這冰冷的輪廓，證明我還能被觸碰。</p>
    <p>用那顆湧動著<br>滾燙血液的心臟<br>……向我禱告吧……</p>
