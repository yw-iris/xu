  <div class="bodytext">
    <p class="lead">飞鸟衔走我的名字，从此我只剩下一声未出口的「信徒」。</p>
    <p>你問我為何而來。我答不上來——像烏鴉停在枯枝，只是<span class="em">停</span>了，沒有理由。</p>
    <p>細數我的罪，第一片是羽。它輕，卻壓得我抬不起頭；它黑，卻比任何光都更誠實。</p>
    <p>請像雕刻藝術那樣褻瀆我……用那顆湧動著滾燙血液的心臟，……向我禱告吧……</p>
