  <div class="bodytext">
    <p class="lead">烏鴉落在十字架頂端，牠不祈禱，牠只見證。黑翼拂過我的額頭，像一封沒有地址的信。</p>
    <p>牠銜來一粒<span class="em">紅</span>，是我最後的心跳，放在我攤開的掌心裡——卻不替我送出去。</p>
    <p>夜裡牠數我的罪，一聲一聲，比鐘還準。我開始相信，有些救贖，是黑色的、有喙、且永遠沉默。</p>
    <p>請像雕刻藝術那樣褻瀆我……用那顆湧動著滾燙血液的心臟。</p>
