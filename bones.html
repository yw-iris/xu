  <div class="bodytext">
    <p class="lead">我曾是一具會禱告的身體。如今只剩骨架，替我記得彎曲的姿勢。</p>
    <p>你數過我的肋骨嗎？<span class="em">每一根</span>，都是一句未說完的禱詞，被風乾、被染色、被掛在無人來往的迴廊。</p>
    <p>骨縫之間，仍有紅色的河流。它不流向心臟——心早已被雕刻成標本——它只流向你即將跪下的膝蓋。</p>
    <p>請像雕刻藝術那樣褻瀆我……用那顆湧動著滾燙血液的心臟，……向我禱告吧……</p>
