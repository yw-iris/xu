<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絮 · XÙ — 碎片索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <span class="notch"></span>
  <span class="speaker"></span>

<main class="poster">

  <!-- TOP BAR -->
  <header class="topbar">
    <a class="brand" href="home.html"><span class="dot"></span>絮<small>XÙ</small></a>
  </header>

  <!-- 细数我的罪 … 羽 骨 血 神（可长按牵引红线串联） -->
  <section class="sins fade d2">
    <div class="kicker"><span class="n">04</span> Index · 碎片索引</div>
    <div class="sins-title">细数我的罪 …</div>

    <!-- 红线交互提示：置于标题下、卡片之上的醒目位置（非页底） -->
    <p class="link-hint" id="linkHint"><span class="hint-main"><b>双击</b>任意碎片选中，再<b>点击</b>另一块 · 红线即连成</span><span class="hint-sub">（可任意多重连接 · 点 ↗ 打开详情）</span></p>

    <div class="traces" id="traces">
      <!-- 红线画在卡片之下（z-index 低于卡片），只从卡片间的缝隙透出，绝不遮挡卡片上层 -->
      <div class="dots" aria-hidden="true">
        <canvas id="thread" width="100" height="100"></canvas>
      </div>

      <!-- 羽 (right, upper) -->
      <a class="trace t1" href="crow.html" draggable="false">
        <span class="no">[ 01* ]</span>
        <span class="art"><img src="assets/yu.jpg" alt="羽"></span>
        <span class="label"><span class="cn">羽 <span class="ar">↗</span></span><span class="en">Feather</span></span>
        <span class="note">飞鸟衔走名字。</span>
      </a>

      <!-- 骨 (left, tall) -->
      <a class="trace t2" href="bones.html" draggable="false">
        <span class="no">[ 02* ]</span>
        <span class="art"><img src="assets/gu.jpg" alt="骨"></span>
        <span class="label"><span class="cn">骨 <span class="ar">↗</span></span><span class="en">Bone</span></span>
        <span class="note">骨架替我记着姿势。</span>
      </a>

      <!-- 血 (right, lower, indented) -->
      <a class="trace t3" href="church.html" draggable="false">
        <span class="no">[ 03* ]</span>
        <span class="art"><img src="assets/xue.jpg" alt="血"></span>
        <span class="label"><span class="cn">血 <span class="ar">↗</span></span><span class="en">Blood</span></span>
        <span class="note">它只流向你的膝。</span>
      </a>

      <!-- 神 (left, lowest) -->
      <a class="trace t4" href="statue.html" draggable="false">
        <span class="no">[ 04* ]</span>
        <span class="art"><img src="assets/shen.jpg" alt="神"></span>
        <span class="label"><span class="cn">神 <span class="ar">↗</span></span><span class="en">Deity</span></span>
        <span class="note">石也会流血。</span>
      </a>
    </div>

    <div class="sin-keys"><span>羽</span><span>骨</span><span>血</span><span>神</span></div>
  </section>

  <!-- 伸手的光 + 结尾（由祷念正文切分至模块页底部） -->
  <figure class="sins-fig">
    <img src="assets/hands.jpg" alt="伸向光的手">
  </figure>

  <section class="end fade d3">
    <p>…虐杀我的灵魂…</p>
    <p class="endmark">..End..</p>
    <div class="cross">&#8224;</div>
  </section>

</main>

</div>

<!-- ============ 交互红线：双击碎片选中，再点击另一块即连成红线 ============ -->
<script>
(function(){
  var wrap = document.getElementById('traces');
  var cv   = document.getElementById('thread');
  var hint = document.getElementById('linkHint');
  if(!wrap || !cv) return;
  var cards = Array.prototype.slice.call(wrap.querySelectorAll('.trace'));
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  var links = [];        // 已连成的红线 {a, b}
  var sel   = -1;        // 当前选中的源卡片下标（-1 未选）
  var DEFAULT_HINT = hint ? hint.innerHTML : '';

  function wrapRect(){ return wrap.getBoundingClientRect(); }
  function size(){
    var r = wrapRect();
    if(!r.width) return;
    cv.width  = Math.round(r.width*dpr);
    cv.height = Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  function center(i){
    var r = cards[i].getBoundingClientRect();
    var w = wrapRect();
    return { x:(r.left+r.right)/2 - w.left, y:(r.top+r.bottom)/2 - w.top };
  }
  function dot(p, rad, a){
    ctx.fillStyle = 'rgba(224,16,34,'+a+')';
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI*2); ctx.fill();
  }
  function line(a, b, a1){
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(224,16,34,'+a1+')';
    ctx.lineWidth = 1.7;
    ctx.shadowColor = 'rgba(224,16,34,.45)'; ctx.shadowBlur = 7;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  function draw(){
    var r = wrapRect();
    ctx.clearRect(0,0,r.width,r.height);
    // 已连成的命运之线（在卡片之下，仅缝隙可见）
    links.forEach(function(l){
      var a = center(l.a), b = center(l.b);
      line(a, b, 0.82); dot(b, 2.6, 0.9);
    });
  }
  // 是否已存在该无序对（避免同对重复叠线；不同对、多重连接均允许）
  function pairExists(a, b){
    for(var i=0;i<links.length;i++){
      var l = links[i];
      if((l.a===a && l.b===b) || (l.a===b && l.b===a)) return true;
    }
    return false;
  }
  function setSel(i){
    if(sel >= 0) cards[sel].classList.remove('selected');
    sel = i;
    if(sel >= 0) cards[sel].classList.add('selected');
  }
  function clearSel(){ setSel(-1); }

  function toggle(i){
    if(sel === -1){
      // 双击：选中该碎片（红边框变粗 = 待连线）
      setSel(i);
      if(hint) hint.innerHTML = '已选中 <b>'+(i+1)+'号</b> 碎片 · 再点击另一块连成红线';
    } else if(sel === i){
      // 双击同一块：取消选择
      clearSel();
      if(hint) hint.innerHTML = DEFAULT_HINT;
    } else {
      // 双击另一块：也直接连成（与「单击连接」等价）
      var ok = !pairExists(sel, i);
      if(ok) links.push({ a:sel, b:i });
      clearSel();
      if(ok && hint) hint.innerHTML = '已连 <b>'+links.length+'</b> 条命运之线 · 继续双击选中、点击连成';
      draw();
    }
  }

  cards.forEach(function(el, i){
    el.style.touchAction = 'manipulation';
    el.addEventListener('dragstart', function(e){ e.preventDefault(); });
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    // 单击：仅当已选中一块时，点另一块即连成红线；卡片本体永不跳转（避免误入详情页）
    el.addEventListener('click', function(e){
      if(e.target.closest('.ar')) return;   // ↗ 箭头：放行，打开详情页
      e.preventDefault();
      if(sel >= 0 && sel !== i){
        var ok = !pairExists(sel, i);
        if(ok) links.push({ a:sel, b:i });
        clearSel();
        if(ok && hint) hint.innerHTML = '已连 <b>'+links.length+'</b> 条命运之线 · 继续双击选中、点击连成';
        draw();
      }
    });
    // 双击：选中 / 取消选中该碎片
    el.addEventListener('dblclick', function(e){
      if(e.target.closest('.ar')) return;
      e.preventDefault();
      toggle(i);
    });
    // 已选一块时，悬停另一块预览为连线目标（粗红框）
    el.addEventListener('mouseenter', function(){
      if(sel >= 0 && sel !== i) el.classList.add('link-target');
    });
    el.addEventListener('mouseleave', function(){
      el.classList.remove('link-target');
    });
  });

  // 点击空白处取消当前选择
  window.addEventListener('click', function(e){
    if(!e.target.closest('.trace')) clearSel();
  });

  window.addEventListener('resize', size);
  requestAnimationFrame(size);
  setTimeout(size, 350);
})();
</script>



</body>
</html>
