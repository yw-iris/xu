<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絮 · XÙ — 碎片索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <span class="notch"></span>
  <span class="speaker"></span>

<main class="poster">

  <!-- TOP BAR -->
  <header class="topbar">
    <a class="brand" href="home.html"><span class="dot"></span>絮<small>XÙ</small></a>
  </header>

  <!-- 细数我的罪 … 羽 骨 血 神（可长按牵引红线串联） -->
  <section class="sins fade d2">
    <div class="kicker"><span class="n">04</span> Index · 碎片索引</div>
    <div class="sins-title">细数我的罪 …</div>

    <!-- 红线交互提示：置于标题下、卡片之上的醒目位置（非页底） -->
    <p class="link-hint" id="linkHint"><b>长按</b>任意碎片，待<b>红边框变粗</b>，延伸红线链接其它模块<span class="hint-sub">（可任意多重连接）</span></p>

    <div class="traces" id="traces">
      <!-- 红线画在卡片之下（z-index 低于卡片），只从卡片间的缝隙透出，绝不遮挡卡片上层 -->
      <div class="dots" aria-hidden="true">
        <canvas id="thread" width="100" height="100"></canvas>
      </div>

      <!-- 羽 (right, upper) -->
      <a class="trace t1" href="crow.html" draggable="false">
        <span class="no">[ 01* ]</span>
        <span class="art"><img src="assets/yu.jpg" alt="羽"></span>
        <span class="label"><span class="cn">羽 <span class="ar">↗</span></span><span class="en">Feather</span></span>
        <span class="note">飞鸟衔走名字。</span>
      </a>

      <!-- 骨 (left, tall) -->
      <a class="trace t2" href="bones.html" draggable="false">
        <span class="no">[ 02* ]</span>
        <span class="art"><img src="assets/gu.jpg" alt="骨"></span>
        <span class="label"><span class="cn">骨 <span class="ar">↗</span></span><span class="en">Bone</span></span>
        <span class="note">骨架替我记着姿势。</span>
      </a>

      <!-- 血 (right, lower, indented) -->
      <a class="trace t3" href="church.html" draggable="false">
        <span class="no">[ 03* ]</span>
        <span class="art"><img src="assets/xue.jpg" alt="血"></span>
        <span class="label"><span class="cn">血 <span class="ar">↗</span></span><span class="en">Blood</span></span>
        <span class="note">它只流向你的膝。</span>
      </a>

      <!-- 神 (left, lowest) -->
      <a class="trace t4" href="statue.html" draggable="false">
        <span class="no">[ 04* ]</span>
        <span class="art"><img src="assets/shen.jpg" alt="神"></span>
        <span class="label"><span class="cn">神 <span class="ar">↗</span></span><span class="en">Deity</span></span>
        <span class="note">石也会流血。</span>
      </a>
    </div>

    <div class="sin-keys"><span>羽</span><span>骨</span><span>血</span><span>神</span></div>
  </section>

  <!-- 伸手的光 + 结尾（由祷念正文切分至模块页底部） -->
  <figure class="sins-fig">
    <img src="assets/hands.jpg" alt="伸向光的手">
  </figure>

  <section class="end fade d3">
    <p>…虐杀我的灵魂…</p>
    <p class="endmark">..End..</p>
    <div class="cross">&#8224;</div>
  </section>

</main>

</div>

<!-- ============ 交互红线：长按碎片拉出红线，接触到另一块即连上 ============ -->
<script>
(function(){
  var wrap = document.getElementById('traces');
  var cv   = document.getElementById('thread');
  var hint = document.getElementById('linkHint');
  if(!wrap || !cv) return;
  var cards = Array.prototype.slice.call(wrap.querySelectorAll('.trace'));
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  var links = [];        // 已连成的红线 {a, b}
  var drag  = null;      // 当前正在牵引 {from, x, y, over}
  var CHARGE = 650;      // 长按蓄力毫秒：红边框在此期间逐渐变粗
  var LONGPRESS = CHARGE;
  var MOVE_T    = 8;     // 移动阈值（px），超过即视为拖拽
  var timer = null, srcIdx = -1, sx = 0, sy = 0, linking = false, justDragged = false;

  function wrapRect(){ return wrap.getBoundingClientRect(); }
  function size(){
    var r = wrapRect();
    if(!r.width) return;
    cv.width  = Math.round(r.width*dpr);
    cv.height = Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  function center(i){
    var r = cards[i].getBoundingClientRect();
    var w = wrapRect();
    return { x:(r.left+r.right)/2 - w.left, y:(r.top+r.bottom)/2 - w.top };
  }
  function dot(p, rad, a){
    ctx.fillStyle = 'rgba(224,16,34,'+a+')';
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI*2); ctx.fill();
  }
  function line(a, b, a1){
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(224,16,34,'+a1+')';
    ctx.lineWidth = 1.7;
    ctx.shadowColor = 'rgba(224,16,34,.45)'; ctx.shadowBlur = 7;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  function draw(){
    var r = wrapRect();
    ctx.clearRect(0,0,r.width,r.height);
    // 已连成的命运之线（在卡片之下，仅缝隙可见）
    links.forEach(function(l){
      var a = center(l.a), b = center(l.b);
      line(a, b, 0.82); dot(b, 2.6, 0.9);
    });
    // 正在牵引的红线
    if(drag){
      var a = center(drag.from);
      var b = (drag.over >= 0) ? center(drag.over) : { x:drag.x, y:drag.y };
      line(a, b, 0.96); dot(a, 3.2, 1);
      if(drag.over >= 0) dot(b, 3.2, 1);
    }
  }
  // 命中检测：返回指针所在（且非源）卡片下标
  function cardAt(x, y, exc){
    for(var i=0;i<cards.length;i++){
      if(i === exc) continue;
      var r = cards[i].getBoundingClientRect();
      if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return i;
    }
    return -1;
  }
  // 是否已存在该无序对（避免同对重复叠线；不同对、多重连接均允许）
  function pairExists(a, b){
    for(var i=0;i<links.length;i++){
      var l = links[i];
      if((l.a===a && l.b===b) || (l.a===b && l.b===a)) return true;
    }
    return false;
  }
  function startLink(x, y){
    if(srcIdx < 0) return;
    linking = true;
    var w = wrapRect();
    drag = { from:srcIdx, x:x-w.left, y:y-w.top, over:-1 };
    cards[srcIdx].classList.remove('charging');
    cards[srcIdx].classList.add('linking');
  }
  function beginLink(){ startLink(sx, sy); }
  function endLink(){
    clearTimeout(timer); timer = null;
    if(linking){
      var over = drag ? drag.over : -1;
      if(over >= 0 && !pairExists(drag.from, over)){
        links.push({ a:drag.from, b:over });
        if(hint) hint.innerHTML = '已连 <b>'+links.length+'</b> 条命运之线 · 长按其它碎片继续串联';
      }
      cards.forEach(function(c){ c.classList.remove('linking','link-target','charging'); });
      drag = null; linking = false; justDragged = true;
      setTimeout(function(){ justDragged = false; }, 0);
      draw();
    }
    srcIdx = -1;
  }

  cards.forEach(function(el, i){
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();          // 阻止 <a> 原生拖拽 / 文本选择，避免 pointercancel 打断连线
      srcIdx = i; sx = e.clientX; sy = e.clientY; linking = false;
      el.style.setProperty('--charge-dur', CHARGE + 'ms');
      el.classList.add('charging');   // 红边框开始逐渐变粗（蓄力）
      timer = setTimeout(beginLink, LONGPRESS);
    });
    el.addEventListener('dragstart', function(e){ e.preventDefault(); });
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    el.addEventListener('click', function(e){
      if(justDragged){ e.preventDefault(); justDragged = false; }
    });
  });

  window.addEventListener('pointermove', function(e){
    if(srcIdx < 0) return;
    // 长按未触发前，移动视为滚动 —— 取消长按 + 移除蓄力态，不启动连线（保留页面滚动）
    if(!linking){
      if(Math.hypot(e.clientX-sx, e.clientY-sy) > MOVE_T){
        clearTimeout(timer);
        if(cards[srcIdx]) cards[srcIdx].classList.remove('charging');
      }
      return;
    }
    var w = wrapRect();
    drag.x = e.clientX - w.left; drag.y = e.clientY - w.top;
    var over = cardAt(e.clientX, e.clientY, drag.from);
    if(over !== drag.over){
      drag.over = over;
      cards.forEach(function(c, ci){ c.classList.toggle('link-target', ci === over); });
    }
    draw();
  });
  window.addEventListener('pointerup', endLink);
  window.addEventListener('pointercancel', endLink);

  window.addEventListener('resize', size);
  requestAnimationFrame(size);
  setTimeout(size, 350);
})();
</script>



</body>
</html>
