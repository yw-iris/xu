<!-- ============ 常驻命运之线：四个碎片依次被红线串联 + 依次掉落出场 ============ -->
<script>
(function(){
  var wrap = document.getElementById('traces');
  var cv   = document.getElementById('thread');
  if(!wrap || !cv) return;
  var cards = Array.prototype.slice.call(wrap.querySelectorAll('.trace')); // 羽 骨 血 神
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function wrapRect(){ return wrap.getBoundingClientRect(); }
  function size(){
    var r = wrapRect();
    if(!r.width) return;
    cv.width  = Math.round(r.width*dpr);
    cv.height = Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function center(i){
    var r = cards[i].getBoundingClientRect();
    var w = wrapRect();
    return { x:(r.left+r.right)/2 - w.left, y:(r.top+r.bottom)/2 - w.top };
  }

  // —— 依次掉落出场：四块碎片按 150/450/750/1050ms 依次落下 ——
  var DROPS = [150, 450, 750, 1050];
  cards.forEach(function(el, i){
    el.classList.add('drop');
    el.style.animationDelay = DROPS[i] + 'ms';
    el.addEventListener('animationend', function(){
      el.classList.remove('drop');
      el.style.animation = '';
      el.style.opacity = '1';
    }, {once:true});
  });

  // —— 常驻红线：碎片落地后，命运之线按 01→02→03→04 依次缝连，永久保留 ——
  var born = performance.now();
  function draw(){
    var t = (performance.now() - born)/1000;
    var r = wrapRect();
    if(!r.width) return;
    ctx.clearRect(0, 0, r.width, r.height);
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(224,16,34,.8)';
    ctx.lineWidth = 1.7;
    ctx.shadowColor = 'rgba(224,16,34,.45)'; ctx.shadowBlur = 7;
    for(var i=0; i<cards.length-1; i++){
      var land = DROPS[i]/1000 + 0.6;               // 第 i 块落定后线才开始缝
      var p = Math.max(0, Math.min(1, (t - land)/0.5));
      if(p <= 0) continue;
      var a = center(i), b = center(i+1);
      var ex = a.x + (b.x-a.x)*p, ey = a.y + (b.y-a.y)*p;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.fillStyle = 'rgba(224,16,34,.9)';
      ctx.beginPath(); ctx.arc(ex, ey, 2.6, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
  (function loop(){
    draw();
    var t = (performance.now() - born)/1000;
    if(t < 4.5){ requestAnimationFrame(loop); }      // 出场动画结束后红线已全部缝成
  })();

  window.addEventListener('resize', size);
  requestAnimationFrame(size);
  setTimeout(size, 400);
})();
</script>



<!-- BGM：隐藏视频音轨循环播放（进入页面自动播放，全站延续；首次交互兜底开声；静音状态跨页记忆） -->
<!-- BGM：iframe 壳承载时由 shell 统一播放；独立打开时自播；静音跨页记忆 -->
<!-- BGM：iframe 壳承载时由 shell 统一播放；独立打开时自播；静音跨页记忆 -->
<!-- BGM：iframe 壳承载时由 shell 统一播放；独立打开时自播；静音跨页记忆 -->
<audio id="bgm" src="assets/bgm.mp4" loop preload="auto" playsinline></audio>
<button id="bgmToggle" class="bgm-toggle" type="button" aria-label="背景音乐 开/关" title="背景音乐">♪</button>
<script>
(function(){
  var IN_FRAME = (window.self !== window.top);
  // 顶层直接访问 → 交给 shell 承载（切换页面音乐不断）；?raw 可绕过用于调试
  if(!IN_FRAME){
    var cur = location.pathname.split('/').pop() || 'index.html';
    if(location.search.indexOf('raw') < 0){ location.replace('shell.html?p=' + cur); return; }
  }
  // 站内链接：iframe 内让 shell 切换 iframe；顶层也交给 shell
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    if(a.target || /^https?:/.test(h)) return;
    if(/\.html/.test(h)){
      e.preventDefault();
      var target = h.split('#')[0].split('?')[0];
      if(IN_FRAME){ parent.postMessage({type:'xu-nav', href:target}, '*'); }
      else { location.href = 'shell.html?p=' + target; }
    }
  });
  var KEY = 'xu_bgm_off';
  var btn = document.getElementById('bgmToggle');
  // 处于 iframe 内：音频交给 shell，按钮作为静音控制转发给 shell
  if(IN_FRAME){
    var bgm = document.getElementById('bgm'); if(bgm) bgm.remove();
    var on = localStorage.getItem(KEY) !== '1';
    if(btn){ btn.classList.toggle('off', !on);
      btn.addEventListener('click', function(e){ e.stopPropagation(); parent.postMessage({type:'xu-mute'}, '*'); });
    }
    // 首次交互（点/触/击）→ 通知 shell 立即开声（移动端 touchstart 更可靠）
    function fwdGesture(){ parent.postMessage({type:'xu-gesture'}, '*'); }
    document.addEventListener('pointerdown', fwdGesture, {once:true});
    document.addEventListener('touchstart', fwdGesture, {once:true});
    document.addEventListener('click', fwdGesture, {once:true});
    // 接收 shell 的静音状态回传
    window.addEventListener('message', function(e){ var d=e.data||{}; if(d.type==='xu-mute-state' && btn){ btn.classList.toggle('off', !d.on); } });
    return;
  }
  // —— 以下仅在顶层独立打开（?raw）时执行 ——
  var bgm = document.getElementById('bgm');
  if(!bgm) return;
  bgm.volume = 0.5;
  var on = localStorage.getItem(KEY) !== '1';
  function applyBtn(){ if(btn) btn.classList.toggle('off', !on); }
  applyBtn();
  function tryPlay(){ if(on) bgm.play().catch(function(){}); }
  tryPlay();
  window.addEventListener('load', tryPlay);
  function startOnce(){ tryPlay(); window.removeEventListener('pointerdown', startOnce); window.removeEventListener('touchstart', startOnce); window.removeEventListener('keydown', startOnce); }
  window.addEventListener('pointerdown', startOnce);
  window.addEventListener('touchstart', startOnce);
  window.addEventListener('keydown', startOnce);
  if(btn) btn.addEventListener('click', function(e){ e.stopPropagation(); on=!on; localStorage.setItem(KEY, on?'0':'1'); applyBtn(); if(on) tryPlay(); else bgm.pause(); });
})();
</script>



<!-- 刊头图点击：血液从图片底下流出（参考血迹笔刷：锯齿血毯 + 垂流 + 血珠 + 溅点，随机生成） -->
<script>
(function(){
  var box = document.getElementById('snowBox');
  var img = document.getElementById('snowImg');
  if(!box || !img) return;
  img.addEventListener('click', function(e){
    e.preventDefault();
    if(box.querySelector('.blood-pour')) return;      // 正在流血时不重复触发
    var NS = 'http://www.w3.org/2000/svg';
    var W = img.clientWidth || 380, Hh = 300;
    function rnd(a,b){ return a + Math.random()*(b-a); }
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+Hh);
    svg.setAttribute('class','blood-svg');
    var g = document.createElementNS(NS,'g');
    var COL = '#9e1220';

    // —— 主体血毯：上缘贴住图片底边，下缘为随机锯齿 + 深垂口 ——
    var edge = 'M0,0 L'+W+',0 L'+W+',28 ';
    var x = W, y = 28;
    while(x > 0){
      var step = rnd(14, 42), nx = Math.max(0, x-step);
      if(Math.random() < 0.24){                       // 深垂的锯齿口
        var dy = rnd(45, 115);
        edge += ' Q'+x+','+(y+dy)+' '+(x-step*0.5)+','+(y+dy)+
                ' Q'+nx+','+(y+dy)+' '+nx+','+(y+rnd(10,38))+' ';
        y += rnd(6, 24); if(y > 95) y = 95;
      } else {                                        // 普通起伏
        y = Math.max(12, Math.min(95, y+rnd(-16,16)));
        edge += ' Q'+((x+nx)/2)+','+(y+rnd(-8,10))+' '+nx+','+y+' ';
      }
      x = nx;
    }
    edge += 'L0,28 Z';
    var mass = document.createElementNS(NS,'path');
    mass.setAttribute('d', edge);
    mass.setAttribute('fill', COL);
    g.appendChild(mass);

    // —— 垂流：粗细长短不一的细长血柱，部分底端带脱离的血珠 ——
    for(var i=0;i<14;i++){
      var dx0 = rnd(6, W-6), len = rnd(50, 225), wdt = rnd(2.5, 10);
      var d = 'M'+(dx0-wdt/2)+',22 L'+(dx0+wdt/2)+',22'+
              ' L'+(dx0+wdt*0.32)+','+(22+len-10)+
              ' Q'+dx0+','+(22+len+9)+' '+(dx0-wdt*0.32)+','+(22+len-10)+' Z';
      var p2 = document.createElementNS(NS,'path');
      p2.setAttribute('d', d); p2.setAttribute('fill', COL);
      g.appendChild(p2);
      if(Math.random() < 0.5){
        var c = document.createElementNS(NS,'circle');
        c.setAttribute('cx', dx0+rnd(-3,3));
        c.setAttribute('cy', 22+len+rnd(10,42));
        c.setAttribute('r', rnd(1.6, 4));
        c.setAttribute('fill', COL);
        g.appendChild(c);
      }
    }

    // —— 溅点：散落的细小血滴 ——
    for(var j=0;j<26;j++){
      var c2 = document.createElementNS(NS,'circle');
      c2.setAttribute('cx', rnd(0, W));
      c2.setAttribute('cy', rnd(28, Hh));
      c2.setAttribute('r', rnd(0.8, 3.2));
      c2.setAttribute('fill', COL);
      g.appendChild(c2);
    }

    svg.appendChild(g);
    var p = document.createElement('div');
    p.className = 'blood-pour';
    p.appendChild(svg);
    box.appendChild(p);
    setTimeout(function(){ p.classList.add('out'); }, 3400);   // 流尽后渗散
    setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 4800);
  });
})();
</script>
