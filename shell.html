<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>絮 · 祷念</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;display:block;z-index:1;}
</style>
</head>
<body>
<!-- 持久播放层：主 document 不随站内导航重载，音乐不断 -->
<!-- 静音按钮放在 iframe 内的内容页里（避免被全屏 iframe 遮挡），通过 postMessage 控制下方音频 -->
<audio id="bgm" src="assets/bgm.mp4" loop preload="auto" playsinline></audio>
<iframe id="stage" src=""></iframe>
<script>
(function(){
  var bgm = document.getElementById('bgm');
  var btn = document.getElementById('bgmToggle');
  var stage = document.getElementById('stage');
  var KEY = 'xu_bgm_off';
  var on = localStorage.getItem(KEY) !== '1';
  bgm.volume = 0.5;
  function applyBtn(){ if(btn) btn.classList.toggle('off', !on); }  // 按钮在 iframe 内，shell 无自身按钮时安全跳过
  applyBtn();
  // 带声起播；若被浏览器自动播放策略拦截 → 先静音起播（浏览器允许），待首次手势再开声
  function startWithSound(){
    if(!on) return;
    var p = bgm.play();
    if(p && p.catch){
      p.catch(function(){
        bgm.muted = true;
        bgm.play().catch(function(){});
      });
    }
  }
  function unmuteOnGesture(){                      // 首次手势：解除静音并起播（处于手势上下文，必成功）
    if(!on) return;
    if(bgm.muted) bgm.muted = false;
    bgm.play().catch(function(){});
  }
  startWithSound();                                // 进入即尝试起播
  window.addEventListener('load', startWithSound);
  bgm.addEventListener('loadeddata', startWithSound);
  bgm.addEventListener('canplay', startWithSound);
  // shell 顶层兜底：首次手势立即开声（iframe 内由 xu-gesture 转发）
  function firstGesture(){ unmuteOnGesture(); }
  window.addEventListener('pointerdown', firstGesture, {once:true});
  window.addEventListener('touchstart', firstGesture, {once:true});
  window.addEventListener('keydown', firstGesture, {once:true});
  if(btn) btn.addEventListener('click', function(e){
    e.stopPropagation();
    on = !on;
    localStorage.setItem(KEY, on ? '0' : '1');
    applyBtn();
    if(on) unmuteOnGesture(); else bgm.pause();
  });
  // 初始页面：?p=xxx，默认 index.html（仅允许本站相对路径）
  var p = new URLSearchParams(location.search).get('p');
  if(!p || /^https?:/.test(p) || p.charAt(0) === '/' || p.indexOf('..') >= 0){ p = 'index.html'; }
  stage.src = p;
  // 接收 iframe 内发来的导航 / 交互 / 静音信号
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if(d.type === 'xu-nav'){
      if(/\.html/.test(d.href) && d.href.charAt(0) !== '/' && !/^https?:/.test(d.href)){
        stage.src = d.href;
        history.replaceState(null, '', '?p=' + d.href);
      }
    } else if(d.type === 'xu-gesture'){
      unmuteOnGesture();                           // iframe 内首次交互 → 立即开声
    } else if(d.type === 'xu-mute'){
      on = !on;
      localStorage.setItem(KEY, on ? '0' : '1');
      if(on) unmuteOnGesture(); else bgm.pause();
      if(stage.contentWindow) stage.contentWindow.postMessage({type:'xu-mute-state', on:on}, '*'); // 回传状态给按钮
    }
  });
})();
</script>
</body>
</html>
