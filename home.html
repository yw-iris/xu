<!-- 开场动画逻辑：播放黑色背景上的文字心视频，结束进入正文 -->
<script>
(function(){
  var intro = document.getElementById('intro');
  if(!intro) return;
  var KEY = 'xu_intro_v4';
  var force = /[?&]intro\b/.test(location.search);
  if(!force && localStorage.getItem(KEY)){ intro.parentNode.removeChild(intro); return; }

  var vid  = document.getElementById('introVid');
  var skip = document.getElementById('skip');
  var tap  = document.getElementById('introTap');
  var done = false;
  function persist(){ try{ localStorage.setItem(KEY,'1'); }catch(e){} }
  function finish(){
    if(done) return; done = true;
    intro.classList.add('gone');
    setTimeout(function(){
      if(intro.parentNode) intro.parentNode.removeChild(intro);
    }, 950);
  }
  // 仅「主动点跳过」才记忆，自然播完不锁死（便于反复查看开场）
  if(skip) skip.addEventListener('click', function(){ persist(); finish(); });
  if(!vid){ finish(); return; }

  // 带静音属性后尝试播放（iOS 要求 muted 才允许自动播放）
  function play(){
    vid.muted = true; vid.defaultMuted = true; vid.setAttribute('muted','');
    var p = vid.play();
    if(p && p.catch) p.catch(function(){});
  }
  vid.addEventListener('ended', finish);
  vid.addEventListener('error', finish);
  vid.addEventListener('playing', function(){ if(tap) tap.style.display='none'; });

  // 先尝试自动播放
  play();
  // 自动播放被拦截（iOS / 部分浏览器）：约 0.7s 后露出「轻触播放」提示
  setTimeout(function(){
    if(vid.paused && !done && tap){ tap.style.display='flex'; }
  }, 700);
  // 任意点击 / 触摸即用手势播放（移动端黑屏兜底）
  intro.addEventListener('pointerdown', function(){ play(); if(tap) tap.style.display='none'; });

  // 兜底：最长 ~9.5s 强制进入正文
  setTimeout(finish, 9500);
})();
</script>

</body>
