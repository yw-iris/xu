<script>
(function(){
  var IN_FRAME = (window.self !== window.top);
  // 顶层直接访问 → 交给 shell 承载（切换页面音乐不断）；?raw 可绕过用于调试

  // 站内链接：iframe 内让 shell 切换 iframe；顶层也交给 shell
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    if(a.target || /^https?:/.test(h)) return;
    if(/\.html/.test(h)){
      e.preventDefault();
      var target = h.split('#')[0].split('?')[0];
      if(IN_FRAME){ parent.postMessage({type:'xu-nav', href:target}, '*'); }
      else { location.href = 'shell.html?p=' + target; }
    }
  });
  var KEY = 'xu_bgm_off';
  var btn = document.getElementById('bgmToggle');
  // 处于 iframe 内：音频交给 shell，按钮作为静音控制转发给 shell
  if(IN_FRAME){
    var bgm = document.getElementById('bgm'); if(bgm) bgm.remove();
    var on = localStorage.getItem(KEY) !== '1';
    if(btn){ btn.classList.toggle('off', !on);
      btn.addEventListener('click', function(e){ e.stopPropagation(); parent.postMessage({type:'xu-mute'}, '*'); });
    }
    // 首次交互 → 通知 shell 开声
    document.addEventListener('pointerdown', function(){ parent.postMessage({type:'xu-gesture'}, '*'); });
    // 接收 shell 的静音状态回传
    window.addEventListener('message', function(e){ var d=e.data||{}; if(d.type==='xu-mute-state' && btn){ btn.classList.toggle('off', !d.on); } });
    return;
  }
  // —— 以下仅在顶层独立打开（?raw）时执行 ——
  var bgm = document.getElementById('bgm');
  if(!bgm) return;
  bgm.volume = 0.5;
  var on = localStorage.getItem(KEY) !== '1';
  function applyBtn(){ if(btn) btn.classList.toggle('off', !on); }
  applyBtn();
  function tryPlay(){ if(on) bgm.play().catch(function(){}); }
  tryPlay();
  window.addEventListener('load', tryPlay);
  function startOnce(){ tryPlay(); window.removeEventListener('pointerdown', startOnce); window.removeEventListener('touchstart', startOnce); window.removeEventListener('keydown', startOnce); }
  window.addEventListener('pointerdown', startOnce);
  window.addEventListener('touchstart', startOnce);
  window.addEventListener('keydown', startOnce);
  if(btn) btn.addEventListener('click', function(e){ e.stopPropagation(); on=!on; localStorage.setItem(KEY, on?'0':'1'); applyBtn(); if(on) tryPlay(); else bgm.pause(); });
})();

<script>
(function(){
  var intro = document.getElementById('intro');
  if(!intro) return;
  var KEY = 'xu_intro_v6';
  var force = /[?&]intro\b/.test(location.search);
  if(!force && sessionStorage.getItem(KEY)){ intro.parentNode.removeChild(intro); return; }

  var skip = document.getElementById('skip');
  var done = false, started = performance.now();
  function persist(){ try{ sessionStorage.setItem(KEY,'1'); }catch(e){} }
  function finish(){
    if(done) return; done = true;
    intro.classList.add('gone');
    setTimeout(function(){ if(intro.parentNode) intro.parentNode.removeChild(intro); }, 950);
  }
  if(skip) skip.addEventListener('click', function(){ persist(); finish(); });
  setTimeout(finish, 30000); // 兜底

  var cv = document.getElementById('introCv');
  if(!cv || !cv.getContext){ finish(); return; }
  var ctx = cv.getContext('2d');
  var RED = 'rgba(225,35,45,';

  Promise.resolve(LAYOUT).then(function(L){
    var W = L.W, H = L.H, words = L.words, nodes = L.nodes, anchors = L.anchors;
    var nodeSet = {}; nodes.forEach(function(n){ nodeSet[n.x + ',' + n.y] = true; });

    // ---- 十字架（从素材抠出，置于心脏上方；红线起点=十字架中心）----
    var crossImg = new Image(); crossImg.src = 'assets/cross.png';
    var CROSS_W = 238, CROSS_H = 293;          // 抠图后实际像素尺寸
    var crossX = 284, crossY = 25, crossS = 0.42; // 逻辑坐标：中心 & 缩放(逻辑px/像素)
    var armFx = 117/CROSS_W, armFy = 137/CROSS_H; // 十字架臂交点(中心)在图中的相对位置
    var crossCx = crossX + (armFx-0.5)*CROSS_W*crossS;
    var crossCy = crossY + (armFy-0.5)*CROSS_H*crossS;
    anchors[0] = [crossCx, crossCy];           // 红线从十字架中心起笔

    // 心脏节点（红线终端）：跳动光标提醒 & 心跳脉冲的中心
    var heartPt = anchors[anchors.length-1];
    var heartX = heartPt[0], heartY = heartPt[1];

    // ---- catmull 松弛曲线 & 拉紧折线（同参数化采样）----
    function catmull(pts, per){
      var P = [pts[0]].concat(pts, [pts[pts.length-1]]), out = [];
      for(var i=0;i<P.length-3;i++){
        var p0=P[i],p1=P[i+1],p2=P[i+2],p3=P[i+3];
        for(var j=0;j<per;j++){
          var t=j/per,t2=t*t,t3=t*t*t;
          out.push([
            0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
            0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
          ]);
        }
      }
      out.push(pts[pts.length-1].slice());
      return out;
    }
    function polyline(pts, n){
      var segs=[], total=0;
      for(var i=0;i<pts.length-1;i++){ var d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); segs.push(d); total+=d; }
      var out=[];
      for(var k=0;k<=n;k++){
        var f=k/n*total, acc=0;
        for(var s=0;s<segs.length;s++){
          if(acc+segs[s]>=f || s===segs.length-1){
            var lp=segs[s]? (f-acc)/segs[s] : 0; lp=Math.max(0,Math.min(1,lp));
            out.push([pts[s][0]+(pts[s+1][0]-pts[s][0])*lp, pts[s][1]+(pts[s+1][1]-pts[s][1])*lp]); break;
          }
          acc+=segs[s];
        }
      }
      return out;
    }
    var relax = catmull(anchors, 14);
    var taut  = polyline(anchors, relax.length-1);
    var N = relax.length;

    // ---- 尺寸 ----
    var scale=1, dpr=1;
    function resize(){
      dpr = window.devicePixelRatio||1;
      scale = Math.min(window.innerWidth/W, window.innerHeight/H);
      cv.width = Math.round(W*scale*dpr); cv.height = Math.round(H*scale*dpr);
      cv.style.width = (W*scale)+'px'; cv.style.height = (H*scale)+'px';
      cv.style.left = '50%'; cv.style.top = '50%';
      cv.style.transform = 'translate(-50%,-50%)';
    }
    window.addEventListener('resize', resize); resize();

    // ---- 丝线状态 ----
    var T0 = 1.4, T1 = 5.2;   // 垂落：1.4s 出现 → 5.2s 落定
    var SCAT = Infinity;      // 消散：点击拉紧后 1.3s 才触发；兜底 22s 自动消散
    var tightTarget = 0, tight = 0, tightAt = -9, beatAt = -1;
    function toLogical(ev){
      var r = cv.getBoundingClientRect();

    }
    intro.addEventListener('pointerdown', function(ev){
      if(ev.target === skip) return;
      var p = toLogical(ev);
      var hit = false;
      for(var i=0;i<nodes.length;i++){
        var n = nodes[i];
        if(Math.abs(p[0]-n.x) < 36 && Math.abs(p[1]-n.y) < 28){ hit = true; break; }
      }
      // 提示点击的心脏节点（红线终端）同样可点 → 扯直 + 心跳
      if(!hit && Math.hypot(p[0]-heartX, p[1]-heartY) < 50){ hit = true; }
      if(hit){
        tightTarget = tightTarget ? 0 : 1;
        tightAt = (performance.now()-started)/1000;
        if(tightTarget){
          if(beatAt < 0) beatAt = tightAt;            // 扯直瞬间：心脏跳一下
          if(SCAT === Infinity) SCAT = tightAt + 1.3; // 拉紧之后心脏才慢慢消隐
        } else {
          SCAT = Infinity; beatAt = -1;               // 还原：取消消隐与跳动
        }
      }
    });

    var fontCache = {};
    function font(sz){
      var k = sz;
      if(!fontCache[k]) fontCache[k] = sz+'px "Noto Sans SC","Noto Sans CJK SC",sans-serif';
      return fontCache[k];
    }

    function frame(now){
      var t = (now-started)/1000;
      if(SCAT === Infinity && t > 22){ SCAT = t; }         // 兜底：一直没点也自动消散
      if(SCAT !== Infinity && t >= SCAT + 1.6){ finish(); return; }
      ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
      var gAll = Math.min(1, t/0.5);                 // 整体淡入
      var scat = SCAT === Infinity ? 0 : Math.max(0, Math.min(1, (t-SCAT)/1.1)); // 快速消隐

      // 文字
      for(var i=0;i<words.length;i++){
        var w = words[i];
        var a = w[3]/255 * (0.72 + 0.28*Math.sin(w[6]*t + w[5]));
        var dx = 0, dy = 0;
        if(scat > 0){
          dy = -scat*scat * 14;                 // 轻微上浮
          a *= Math.max(0, 1 - scat);           // 慢慢消隐
        }
        ctx.globalAlpha = Math.max(0, Math.min(1, a*gAll));
        ctx.fillStyle = nodeSet[w[0]+','+w[1]] ? '#ff5560' : '#fff';
        ctx.font = font(nodeSet[w[0]+','+w[1]] ? Math.min(Math.max(Math.round(w[2]*1.5),20),26) : w[2]);
        ctx.fillText(w[4], w[0]+dx, w[1]+dy);
      }
      ctx.globalAlpha = 1;

      // 十字架（绘于文字之上、红线之下，红线从其臂交点发出）
      if(crossImg.complete && crossImg.naturalWidth){
        var cw = CROSS_W*crossS, ch = CROSS_H*crossS;
        ctx.globalAlpha = gAll;
        ctx.drawImage(crossImg, crossX - cw/2, crossY - ch/2, cw, ch);
        ctx.globalAlpha = 1;
      }

      // 丝线（垂落更慢 + 拉紧动画）
      tight += (tightTarget - tight)*0.14;
      var u = (t - T0)/(T1 - T0);
      if(u > 0){
        var ue = 1 - Math.pow(1 - Math.min(1,u), 2);
        var n = Math.max(2, Math.round(N*ue));
        var wob = Math.exp(-Math.max(0, t-tightAt)*2.5) * (1-Math.abs(tight*2-1)) * 3.5;
        var pts = [];
        for(var k2=0;k2<n;k2++){
          var f2 = k2/(N-1);
          var x0 = relax[k2][0]*(1-tight) + taut[k2][0]*tight;
          var y0 = relax[k2][1]*(1-tight) + taut[k2][1]*tight;
          if(wob) { x0 += Math.sin(t*30 + k2*0.5)*wob; }
          // 垂落中末端摆动
          var sw = 2.6*(1-ue)+0.7;

          ctx.strokeStyle = RED + (205*fade) + ')';
          ctx.lineWidth = 2; ctx.lineJoin = 'miter'; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
          for(var k3=1;k3<pts.length;k3++) ctx.lineTo(pts[k3][0], pts[k3][1]);

          ctx.fillStyle = RED + (225*fade) + ')';

          for(var m=0;m<nodes.length;m++){
            var nx=nodes[m].x+4, ny=nodes[m].y+6, hit=false;
            for(var k4=0;k4<pts.length;k4++){ if(Math.hypot(pts[k4][0]-nx,pts[k4][1]-ny)<8){hit=true;break;} }
            if(hit){
              ctx.strokeStyle = RED + (230*fade) + ')'; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.ellipse(nx,ny,5.5,4.5,0,0,6.29); ctx.stroke();
            }
          }
        }
      }

      if(beatAt >= 0){

          var g = ctx.createRadialGradient(heartX, heartY, 0, heartX, heartY, 26*(1-bp*0.7)+8);
          g.addColorStop(0, RED + (200*ringA) + ')');
          g.addColorStop(1, RED + '0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(heartX, heartY, 26*(1-bp*0.7)+8, 0, 6.29); ctx.fill();
          // 双层大幅扩散红环
          ctx.lineWidth = 3.6*(1-bp)+0.6;
          ctx.strokeStyle = RED + (220*ringA) + ')';
          ctx.beginPath(); ctx.arc(heartX, heartY, 8 + bp*135, 0, 6.29); ctx.stroke();
          ctx.beginPath(); ctx.arc(heartX, heartY, 8 + bp*88, 0, 6.29); ctx.stroke();
        }
      }

      // 跳动光标提醒：未扯直前，心脏节点旁闪烁光标 + 脉动圈 + 提示文字
      if(SCAT === Infinity && tightTarget === 0){
        var pulse = 0.5 + 0.5*Math.sin(t*3.0);
        ctx.strokeStyle = RED + (60 + 90*pulse).toFixed(0) + ')';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(heartX, heartY, 13 + pulse*6, 0, 6.29); ctx.stroke();
        var blink = (Math.sin(t*9) > -0.2) ? 1 : 0.1;   // 光标跳动
        ctx.globalAlpha = blink * gAll;
        ctx.fillStyle = '#ff5560';
        ctx.fillRect(heartX + 17, heartY - 11, 2.6, 22); // 闪烁竖线光标
        ctx.font = font(13);
        ctx.fillText('点此扯直', heartX + 24, heartY - 9); // 闪烁提示文字
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }).catch(function(){ finish(); });
})();
</script>
