<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絮 · XÙ — 飞鸟挣脱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  svg.scene{height:100%;max-height:100vh;width:auto;display:block;}
  .skip{position:fixed;top:14px;right:16px;z-index:5;color:#eee;font:600 13px/1 "Noto Sans SC",sans-serif;
        letter-spacing:.15em;background:none;border:none;cursor:pointer;opacity:.7;}
  .skip:hover{opacity:1;}
  .enter-btn{position:fixed;right:18px;bottom:22px;z-index:6;display:inline-flex;align-items:center;gap:6px;
        color:#fff;text-decoration:none;font:700 15px/1 "Noto Sans SC",sans-serif;letter-spacing:.1em;
        padding:11px 16px;border:1px solid rgba(255,255,255,.5);border-radius:2px;background:rgba(0,0,0,.35);
        opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .6s,transform .6s;}
  .enter-btn .ar{font-size:17px;}
  .enter-btn.show{opacity:1;transform:none;pointer-events:auto;}
  .enter-btn:hover{border-color:#fff;background:rgba(0,0,0,.6);}
  .cap{position:fixed;left:0;right:0;bottom:8px;text-align:center;z-index:4;color:rgba(255,255,255,.28);
       font:600 11px/1 "Oswald",sans-serif;letter-spacing:.4em;pointer-events:none;}
</style>
</head>
<body>
<div class="stage">
  <svg class="scene" viewBox="0 0 487 1080" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- 单只乌鸦几何（黑填充，朝左飞） -->
      <g id="crowShape">
        <ellipse cx="60" cy="32" rx="18" ry="9"/>
        <circle cx="38" cy="28" r="8"/>
        <polygon points="30,25 16,28 30,31"/>
        <polygon points="76,28 104,22 100,41 77,34"/>
        <path d="M52,25 Q30,3 8,15 Q33,22 50,31 Z"/>
        <path d="M68,25 Q92,1 116,13 Q91,21 70,31 Z"/>
      </g>
    </defs>

    <!-- 纸本底：让黑色乌鸦与红线在暗色站点中清晰可见（源图即米白纸本插画） -->
    <rect x="0" y="0" width="487" height="1080" fill="#f1ead9"/>
    <rect x="6" y="6" width="475" height="1068" fill="none" stroke="#cdbfa3" stroke-width="2"/>

    <!-- ===== 分镜底图：4 只乌鸦（左→右）+ 3 条红线，作为静止分镜 ===== -->
    <g id="story" fill="#0a0a0a" opacity="0">
      <use href="#crowShape" transform="translate(105,287) rotate(-18) scale(.95) translate(-60,-32)"/>
      <use href="#crowShape" transform="translate(200,365) rotate(6)   scale(.90) translate(-60,-32)"/>
      <use href="#crowShape" transform="translate(322,480) rotate(-3)  scale(1.15) translate(-60,-32)"/>
      <use href="#crowShape" transform="translate(360,592) rotate(22)  scale(.92) translate(-60,-32)"/>
    </g>
    <g id="storyLines" fill="none" stroke="#c81e2a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <path d="M75,270 Q150,410 230,560"/>
      <path d="M268,530 Q236,596 205,660"/>
      <path d="M225,450 Q231,520 236,590"/>
    </g>
    <g id="storyDots" fill="#c81e2a" opacity="0">
      <circle cx="75"  cy="270" r="4.2"/><circle cx="230" cy="560" r="4.2"/>
      <circle cx="268" cy="530" r="4.2"/><circle cx="205" cy="660" r="4.2"/>
      <circle cx="225" cy="450" r="4.2"/><circle cx="236" cy="590" r="4.2"/>
      <circle cx="345" cy="415" r="3.6"/><circle cx="205" cy="300" r="3.6"/>
    </g>

    <!-- ===== 拴住乌鸦的红线（挣扎/挣脱） ===== -->
    <line id="tether" x1="30" y1="232" x2="105" y2="290" stroke="#e01623" stroke-width="2.8" stroke-linecap="round" opacity="0"/>
    <g id="stubs" stroke="#e01623" stroke-width="2.8" stroke-linecap="round" opacity="0">
      <line id="stubA" x1="30" y1="232" x2="30" y2="232"/>
      <line id="stubB" x1="105" y1="290" x2="105" y2="290"/>
    </g>

    <!-- ===== 活乌鸦（飞行 + 扇翅 + 挣扎） ===== -->
    <g id="flyer" opacity="0">
      <ellipse cx="0" cy="0" rx="20" ry="9" fill="#0a0a0a"/>
      <circle cx="-22" cy="-3" r="8" fill="#0a0a0a"/>
      <polygon points="-30,-6 -47,-2 -30,1" fill="#0a0a0a"/>
      <polygon points="20,-4 41,-11 43,3 22,6" fill="#0a0a0a"/>
      <g id="wings" fill="#0a0a0a">
        <path d="M -4,-5 Q -24,-36 -48,-17 Q -20,-9 -4,-2 Z"/>
        <path d="M -4,5 Q -24,36 -48,17 Q -20,9 -4,2 Z"/>
      </g>
    </g>
  </svg>
</div>

<a class="skip" id="skip" href="index.html">跳过 ›</a>
<a class="enter-btn" id="enterBtn" href="index.html">进入档案 <span class="ar">›</span></a>
<div class="cap">FILE 00½ — 飞鸟 / RELEASE</div>

<script>
(function(){
  var svg   = document.querySelector('svg.scene');
  var story = document.getElementById('story');
  var sLine = document.getElementById('storyLines');
  var sDot  = document.getElementById('storyDots');
  var flyer = document.getElementById('flyer');
  var wings = document.getElementById('wings');
  var tether= document.getElementById('tether');
  var stubs = document.getElementById('stubs');
  var stubA = document.getElementById('stubA');
  var stubB = document.getElementById('stubB');
  var enter = document.getElementById('enterBtn');

  // 航线（右→左）：从画面右侧外进入，依次掠过 4 只分镜乌鸦，终点落在最左(上)那只
  var WP = [
    {x:520, y:585},   // 右侧屏外
    {x:360, y:592},   // 第4只(右下)
    {x:322, y:480},   // 第3只(中右,最大)
    {x:200, y:370},   // 第2只(中上)
    {x:105, y:290}    // 第1只(左上) ← 终点(被拴住的位置)
  ];
  var ANCHOR = {x:30, y:232};   // 红线固定端(左上角)

  function lerp(a,b,t){ return a+(b-a)*t; }
  function ease(t){ return t<0?0 : t>1?1 : t*t*(3-2*t); }
  // 沿折线取点 + 航向角(度)
  function samplePath(p){
    var segs=[], total=0;
    for(var i=0;i<WP.length-1;i++){ var d=Math.hypot(WP[i+1].x-WP[i].x, WP[i+1].y-WP[i].y); segs.push(d); total+=d; }
    var f = p*total, acc=0, k=0;
    for(;k<segs.length;k++){ if(acc+segs[k]>=f || k===segs.length-1) break; acc+=segs[k]; }
    var lp = segs[k]? (f-acc)/segs[k] : 0; lp=Math.max(0,Math.min(1,lp));
    var a=WP[k], b=WP[k+1];
    var x=lerp(a.x,b.x,lp), y=lerp(a.y,b.y,lp);
    var ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI + 180; // 左向乌鸦对齐速度方向
    return {x:x, y:y, ang:ang};
  }

  var T0 = null;
  var PH = {fly0:900, fly1:4400, snap:5750, end:7300};
  function frame(now){
    if(T0===null) T0=now;
    var t = now - T0;

    // —— 分镜底图淡入 ——
    var so = ease(Math.min(1, t/900));
    story.setAttribute('opacity', (so*0.55).toFixed(3));
    sLine.setAttribute('opacity', (so*0.5).toFixed(3));
    sDot.setAttribute('opacity', (so*0.5).toFixed(3));

    // —— 扇翅 ——
    var flap = Math.sin(t/70)*16;

    if(t < PH.fly0){
      flyer.setAttribute('opacity','0');
      tether.setAttribute('opacity','0');
    } else if(t < PH.fly1){
      flyer.setAttribute('opacity','1');
      var p = ease((t-PH.fly0)/(PH.fly1-PH.fly0));
      var s = samplePath(p);
      flyer.setAttribute('transform','translate('+s.x.toFixed(1)+','+s.y.toFixed(1)+') rotate('+s.ang.toFixed(1)+')');
      tether.setAttribute('opacity','0');
    } else if(t < PH.snap){
      // 挣扎：在终点附近抖动，红线拴住并绷紧
      flyer.setAttribute('opacity','1');
      var tug = (t-PH.fly1)/240;                 // 渐强的拉扯
      var jx = Math.sin(t/40)*3*(1+tug), jy = Math.cos(t/33)*3*(1+tug);
      var px = WP[4].x + jx, py = WP[4].y + jy;
      flyer.setAttribute('transform','translate('+px.toFixed(1)+','+py.toFixed(1)+') rotate(-8)');
      tether.setAttribute('opacity','1');
      tether.setAttribute('x2', px.toFixed(1));
      tether.setAttribute('y2', py.toFixed(1));
    } else if(t < PH.end){
      // 挣脱：红线断成两截回弹淡出，乌鸦顺势向上左飞走
      var sp = (t-PH.snap)/(PH.end-PH.snap);
      flyer.setAttribute('opacity', (1-ease(Math.max(0,(sp-0.6)/0.4))).toFixed(3));
      var ex = lerp(WP[4].x, -90, ease(sp));
      var ey = lerp(WP[4].y, 70,  ease(sp));
      flyer.setAttribute('transform','translate('+ex.toFixed(1)+','+ey.toFixed(1)+') rotate(-46)');
      // 断线：两截从断点向两端回缩并淡出
      var bx = WP[4].x, by = WP[4].y;
      var rec = lerp(60, 0, ease(sp));           // 断点向两端退
      stubA.setAttribute('x2', (bx - rec).toFixed(1)); stubA.setAttribute('y2', (by - 18 - rec*0.4).toFixed(1));
      stubB.setAttribute('x1', (bx + rec*0.3).toFixed(1)); stubB.setAttribute('y1', (by + rec*0.3).toFixed(1));
      stubB.setAttribute('x2', (bx + rec).toFixed(1)); stubB.setAttribute('y2', (by + rec*0.3).toFixed(1));
      stubs.setAttribute('opacity', (1-ease(sp)).toFixed(3));
      tether.setAttribute('opacity', (1-ease(sp*3)).toFixed(3));
    } else {
      flyer.setAttribute('opacity','0');
      tether.setAttribute('opacity','0');
      stubs.setAttribute('opacity','0');
      if(!enter.classList.contains('show')) enter.classList.add('show');
    }

    wings.setAttribute('transform','rotate('+flap.toFixed(1)+' 0 0)');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 跳过 → 直接进档案
  var skip = document.getElementById('skip');
  if(skip) skip.addEventListener('click', function(){ enter.classList.add('show'); });
})();
</script>

<!-- 兼容 shell 持久壳：顶层访问交给 shell；iframe 内由 shell 统一播放 BGM -->
<script>
(function(){
  var IN_FRAME = (window.self !== window.top);
  if(!IN_FRAME){
    var cur = location.pathname.split('/').pop() || 'index.html';
    if(location.search.indexOf('raw') < 0){ location.replace('shell.html?p=' + cur); return; }
  }
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    if(a.target || /^https?:/.test(h)) return;
    if(/\.html/.test(h)){
      e.preventDefault();
      var target = h.split('#')[0].split('?')[0];
      if(IN_FRAME){ parent.postMessage({type:'xu-nav', href:target}, '*'); }
      else { location.href = 'shell.html?p=' + target; }
    }
  });
  var KEY = 'xu_bgm_off';
  var btn = document.getElementById('bgmToggle');
  if(IN_FRAME){
    var bgm = document.getElementById('bgm'); if(bgm) bgm.remove();
    var on = localStorage.getItem(KEY) !== '1';
    if(btn){ btn.classList.toggle('off', !on);
      btn.addEventListener('click', function(e){ e.stopPropagation(); parent.postMessage({type:'xu-mute'}, '*'); });
    }
    function fwdGesture(){ parent.postMessage({type:'xu-gesture'}, '*'); }
    document.addEventListener('pointerdown', fwdGesture, {once:true});
    document.addEventListener('touchstart', fwdGesture, {once:true});
    document.addEventListener('click', fwdGesture, {once:true});
    window.addEventListener('message', function(e){ var d=e.data||{}; if(d.type==='xu-mute-state' && btn){ btn.classList.toggle('off', !d.on); } });
    return;
  }
  var bgm = document.getElementById('bgm');
  if(!bgm) return;
  bgm.volume = 0.5;
  var on = localStorage.getItem(KEY) !== '1';
  function applyBtn(){ if(btn) btn.classList.toggle('off', !on); }
  applyBtn();
  function tryPlay(){ if(on) bgm.play().catch(function(){}); }
  tryPlay();
  window.addEventListener('load', tryPlay);
  function startOnce(){ tryPlay(); window.removeEventListener('pointerdown', startOnce); window.removeEventListener('touchstart', startOnce); window.removeEventListener('keydown', startOnce); }
  window.addEventListener('pointerdown', startOnce);
  window.addEventListener('touchstart', startOnce);
  window.addEventListener('keydown', startOnce);
  if(btn) btn.addEventListener('click', function(e){ e.stopPropagation(); on=!on; localStorage.setItem(KEY, on?'0':'1'); applyBtn(); if(on) tryPlay(); else bgm.pause(); });
})();
</script>

</body>
