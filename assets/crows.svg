    <use href="#crow" transform="translate(200,365) rotate(6)   scale(.90) translate(-60,-32)"/>
    <use href="#crow" transform="translate(322,480) rotate(-3)  scale(1.15) translate(-60,-32)"/>
    <use href="#crow" transform="translate(360,592) rotate(22)  scale(.92) translate(-60,-32)"/>
  </g>

  <g fill="none" stroke="#c81e2a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M75,270 Q150,410 230,560"/>
    <path d="M268,530 Q236,596 205,660"/>
    <path d="M225,450 Q231,520 236,590"/>
  </g>
  <g fill="#c81e2a">
    <circle cx="75"  cy="270" r="4.2"/>
    <circle cx="230" cy="560" r="4.2"/>
    <circle cx="268" cy="530" r="4.2"/>
    <circle cx="205" cy="660" r="4.2"/>
    <circle cx="225" cy="450" r="4.2"/>
    <circle cx="236" cy="590" r="4.2"/>
    <circle cx="345" cy="415" r="3.6"/>
    <circle cx="205" cy="300" r="3.6"/>
  </g>
</svg>
