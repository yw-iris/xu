    <p class="lead">替我 赎罪……教堂空了，神提前離席，只剩彩色玻璃把光剪成碎片。</p>
    <p>血從裂縫滲出，沿著石柱蜿蜒成一句誰也讀不懂的經文。它是我身上唯一還在<span class="em">流動</span>的東西。</p>
    <p>慾望之於我，是為了…… 𝔞𝔱𝔬𝔫𝔢𝔪𝔢𝔫𝔱？為了贖回一顆早已不屬於自己的心臟。</p>
