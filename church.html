  <div class="bodytext">
    <p class="lead">教堂空了，神提前離席。只剩彩色玻璃，把光剪成碎片，灑在我低著頭的頸背上。</p>
    <p>我在長椅上坐成一尊雕像，等一場不會降臨的<span class="em">赦免</span>。鐘聲啞了，血從裂縫裡滲出，沿著石柱蜿蜒成一句誰也讀不懂的經文。</p>
    <p>若你路過，請不要替我合上雙手。就讓它們懸在半空，像兩隻還沒學會祈禱的鳥。</p>
    <p>……用那顆湧動著滾燙血液的心臟，向我禱告吧……</p>
